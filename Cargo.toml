[package]
name = "half2k"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[features]
# O aparelho de medicao. Desligado por omissao: o binario publico nao o tem, e
# os ficheiros que o implementam nao estao versionados. Ligar so' para medir:
#     cargo build --release --features ponte
ponte = []

[dependencies]
# Syzygy probing in Rust rather than through the C library: no build script and
# no shim to keep in step. The engine keeps its own board; the conversion to the
# shape the prober wants happens at the probe and nowhere else.
shakmaty = "0.30"
shakmaty-syzygy = { version = "0.28", features = ["mmap"] }

[build-dependencies]
# So' para compilar `src/cabeca.cpp`. Nao entra no binario.
cc = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = true

# Kept separate from `release` so that a profiling build never has to be a
# different set of flags typed from memory.
[profile.release-debug]
inherits = "release"
debug = true
strip = false
