[package]
name = "kestrel"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[features]
# The fitted weight set is the engine now: +152.7 Elo +/- 33.4 over the
# hand-calibrated one, SPRT H1 accepted at 496 games, 347-142-7.
#
# A feature rather than a file so that comparing the two compares two binaries
# and nothing else -- no environment variable, no parsing, no path that exists
# on one side and not the other. Build with --no-default-features to get the
# hand-calibrated set back for a comparison.
default = ["fitted"]
fitted = []

# Acesso a rede: tablebase online e conselheiro. Fora do build por omissao --
# ver a nota no topo de `src/tablebase.rs`.
bot = []

# The king-safety zone widened to the rank in front of the king's neighbours.
# Needs its weights refitted with it to mean anything -- it changes what the
# feature extractor sees. See the note at king_zone in eval.rs.
widekingzone = []

# GoldenEye: when the game is already won, see the way to finish it -- a
# tie-break among moves that all win, preferring the one that ends it soonest.
# See conversion_drive in endgame.rs.
goldeneye = []

# O mesmo ajuste, noutro conjunto de dados: 1.4M de posicoes quietas publicas.
fittedquiet = []

# O mesmo ajuste sobre o binpack publico (test80-2024-06). Ver fitted_sf80.rs.
fittedsf80 = []

# Ajustado nas posicoes dos nossos proprios jogos. Ver fitted_ciclo.rs.
fittedciclo = []

# PSQT lidas pelo flanco do proprio rei. A MESMA
# tabela lida de duas maneiras -- zero pesos novos. Precisa das tabelas
# reajustadas para render, por isso vem com interruptor.
psqtmirror = []

# PSQT afinadas com dimensao de bucket, compiladas. Implica psqtbuckets.
fittedpsqtb8 = ["psqtbuckets"]

# PSQT com dimensao de bucket: [bucket][peca][casa]. Ver PSQT_BUCKETS.
psqtbuckets = []

[lints.rust]
unexpected_cfgs = { level = "allow" }

[dependencies]

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
debug = true
