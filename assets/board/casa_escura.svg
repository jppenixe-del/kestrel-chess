<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="t" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="5" seed="19" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d7050"/>
      <stop offset="1" stop-color="#6d5238"/>
    </linearGradient>
    <pattern id="r" width="100" height="7.5" patternUnits="userSpaceOnUse">
      <rect width="100" height="2.4" y="2.2" fill="#4a3722" opacity=".07"/>
    </pattern>
  </defs>
  <rect width="100" height="100" fill="#7d6142"/>
  <rect width="100" height="100" fill="url(#g)" opacity=".55"/>
  <rect width="100" height="100" fill="url(#r)"/>
  <rect width="100" height="100" filter="url(#t)" opacity=".22" style="mix-blend-mode:multiply"/>
</svg>